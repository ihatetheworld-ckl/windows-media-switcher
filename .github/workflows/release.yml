name: Release win-x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish unpackaged win-x64
        shell: pwsh
        run: |
          ./scripts/publish-win-x64.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsMediaSwitcher-win-x64
          path: dist/WindowsMediaSwitcher-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "dist/WindowsMediaSwitcher-win-x64.zip" `
            --title "Windows Media Switcher $tag" `
            --notes "Unpackaged win-x64 build. Unzip and run WindowsMediaSwitcher.exe. Default hotkey: Win+Shift+V."
